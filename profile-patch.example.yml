# Example profile patch layer for two OpenCode Go credentials.
# Merge the providers dict into the existing `- id: llm-pi-ai` entry of
# $DSH_HOME/profiles/<name>/cordis.patch.yml (do not duplicate the entry).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      opencode-go-2:
        catalog: opencode-go
        displayName: OpenCode Go 2
        apiKeyEnv: OPENCODE_GO_API_KEY_2
